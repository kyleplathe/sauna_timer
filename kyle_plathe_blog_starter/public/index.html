<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070708" />
    <meta name="description" content="Kyle Plathe — personal site, writing, and prototypes." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,650&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Kyle Plathe</title>
    <style>
      :root {
        --bg: #070708;
        --text: #f4f1ea;
        --muted: #a8a29e;
        --lime: #c4f542;
        --line: #26262b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background-image:
          radial-gradient(900px 420px at 50% -10%, rgba(196, 245, 66, 0.1), transparent 55%),
          radial-gradient(700px 360px at 80% 110%, rgba(34, 211, 238, 0.07), transparent 50%);
      }

      main {
        width: min(40rem, calc(100% - 2.5rem));
        text-align: center;
        padding: 3rem 0 4rem;
      }

      .mark {
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        width: 22px;
        height: 22px;
        margin-bottom: 1.75rem;
      }

      .mark span {
        border-radius: 2px;
        background: var(--line);
      }

      .mark span:first-child {
        background: var(--lime);
      }

      .mark span:last-child {
        background: var(--text);
      }

      p.kicker {
        margin: 0 0 1rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 1rem;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(3.2rem, 9vw, 5.6rem);
        font-weight: 520;
        letter-spacing: -0.04em;
        line-height: 0.92;
      }

      .lede a {
        color: var(--lime);
      }

      .lede {
        margin: 0 auto 2.25rem;
        max-width: 28rem;
        color: var(--muted);
        font-size: 1.12rem;
        line-height: 1.55;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        min-height: 3rem;
        padding: 0.85rem 1.45rem;
        border-radius: 999px;
        background: var(--lime);
        color: #111;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
      }

      .btn:hover {
        filter: brightness(1.06);
      }

      .btn span[aria-hidden] {
        font-size: 1.1em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="kicker">kyleplathe.com</p>
      <h1>Kyle Plathe</h1>
      <p class="lede">
        Personal site and notes. Prototypes live at <a href="https://kyleplathe.com/dev/">kyleplathe.com/dev</a>.
      </p>
      <a class="btn" href="https://kyleplathe.com/dev/">Dev projects <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
